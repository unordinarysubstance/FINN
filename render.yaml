# Free demonstration hosting. Runtime data resets when Render sleeps/restarts/redeploys.
services:
  - type: web
    name: finn
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: PORT
        value: "8000"
      - key: FINN_DATA_DIR
        value: /tmp/finn
      - key: FINN_EPHEMERAL_DEMO
        value: "1"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: FINN_REQUIRE_ACCESS
        value: "1"
      - key: FINN_ACCESS_USER
        value: finn
      - key: FINN_ACCESS_PASSWORD
        generateValue: true
      - key: FINN_AI_PROVIDER
        value: gemini
      - key: FINN_GEMINI_MODEL
        value: gemini-3.8-flash
      - key: FINN_GEMINI_TIMEOUT_SECONDS
        value: "120"
# Add GEMINI_API_KEY privately in Render Environment, using a free-tier AI Studio
# project without billing. With no key or on quota failure, FINN shows evidence.
# OpenAI is never called unless FINN_AI_PROVIDER is explicitly set to openai.
