# Free demonstration hosting. Runtime data resets when Render sleeps/restarts/redeploys.
services:
  - type: web
    name: finn
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: PORT
        value: "8000"
      - key: FINN_DATA_DIR
        value: /tmp/finn
      - key: FINN_EPHEMERAL_DEMO
        value: "1"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: FINN_REQUIRE_ACCESS
        value: "1"
      - key: FINN_ACCESS_USER
        value: finn
      - key: FINN_ACCESS_PASSWORD
        generateValue: true
      - key: FINN_MODEL
        value: gpt-4o-mini
      - key: FINN_REVIEW_MODEL
        value: gpt-6.1-sol
      - key: FINN_REVIEW_EFFORT
        value: low
# Leave OPENAI_API_KEY unset for a demo without model API charges.
# Adding an API key enables AI and uses that provider account's credits/billing.
