# Creating this Blueprint provisions paid compute and disk. Review the Render estimate first.
services:
  - type: web
    name: finn
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: finn-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8000"
      - key: FINN_DATA_DIR
        value: /data
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: FINN_REQUIRE_ACCESS
        value: "1"
      - key: FINN_ACCESS_USER
        value: finn
      - key: FINN_ACCESS_PASSWORD
        generateValue: true
      - key: FINN_MODEL
        value: gpt-4o-mini
      - key: FINN_REVIEW_MODEL
        value: gpt-6.1-sol
      - key: FINN_REVIEW_EFFORT
        value: low
# Add OPENAI_API_KEY in Render's secret environment after creation to enable AI.
# Without it, source acquisition and evidence search work without model calls.
